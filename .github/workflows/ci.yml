# CI gate for hypeAfnan — runs on every PR to main (Phase 1.5 sandbox, per vault runbook)
# Free: GitHub Actions is unlimited on public repos. Zero Vercel bandwidth involvement.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Skip Puppeteer's Chromium download (~150MB) — not needed for build
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Build-time placeholders; real values live in Vercel env settings.
      # (sanity/env.ts and app/lib/supabase/* have their own fallbacks, so build passes without secrets.)
      NEXT_PUBLIC_SANITY_PROJECT_ID: 'ci-placeholder'
      NEXT_PUBLIC_SANITY_DATASET: 'production'
      NEXT_PUBLIC_SANITY_API_VERSION: '2024-08-13'
      NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24  # must match local dev (v24) — sanity@6/react-rx require Node >=22.11
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (advisory until Phase 2 cleanup — 46 pre-existing errors, tracked in vault deep-dive §7)
        run: npm run lint
        continue-on-error: true

      - name: Build (production mode)
        run: npm run build

      - name: Smoke check — build output exists
        run: |
          test -f .next/BUILD_ID || { echo "BUILD_ID missing — build incomplete"; exit 1; }
          echo "Build OK: $(cat .next/BUILD_ID)"
